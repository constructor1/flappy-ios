name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile iOS IPA on Mac Cloud
    runs-on: macos-15
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Verify Xcode Version
        run: xcodebuild -version

      - name: 4. Install Capacitor Dependencies
        run: npm install

      - name: 5. Add & Sync iOS Native Platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: 6. Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 7. Package into .IPA (for Sideloadly)
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Flappy-Philippot.ipa Payload

      - name: 8. Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Philippot-iOS
          path: Flappy-Philippot.ipa
          retention-days: 14
